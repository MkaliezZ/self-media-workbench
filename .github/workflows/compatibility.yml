name: Windows and macOS compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner_set:
        description: Standard matrix, or alternate macOS 26 capacity probe
        type: choice
        default: standard
        options: [standard, macos-26]
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.runner_set == 'macos-26' && '["macos-26","macos-26-intel"]' || '["windows-latest","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg on Windows if absent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install FFmpeg on macOS if absent
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Ensure macOS text-rendering filters
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q ' drawtext '; then
            brew install ffmpeg@7
            echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
          fi
      - name: Protocol, routing and actual FFmpeg tests
        env:
          VISUAL_EVIDENCE_ROOT: evaluation/runs/visual
          TIMELINE_EVIDENCE_ROOT: evaluation/runs/timeline
        run: python -B -X utf8 -m unittest discover -s tests -v
      - name: Actual native timeline HTTP, music alignment and restart
        if: always()
        run: python -B -X utf8 scripts/timeline_http_acceptance.py --out evaluation/runs/timeline-http
      - name: Actual native document extraction, PiP motion and reveal showcase
        if: always()
        run: python -B -X utf8 scripts/motion_showcase.py --out evaluation/runs/motion-showcase
      - name: Actual native alpha luma inverse matte, feathered portal and occlusion
        if: always()
        run: python -B -X utf8 scripts/mask_showcase.py --out evaluation/runs/mask-showcase
      - name: Independent changed-material travel timeline
        if: always()
        run: python -B -X utf8 scripts/independent_timeline_acceptance.py --output evaluation/runs/independent-travel
      - name: Independent sealed transitions, alpha masks and genuine historical resume
        if: always()
        run: python -B -X utf8 scripts/independent_fx_acceptance.py --output evaluation/runs/independent-fx
      - name: Real scenic travel edit with pinned public inputs
        if: always()
        run: python -B -X utf8 scripts/real_travel_acceptance.py --out evaluation/runs/real-travel
      - name: Actual native speech, local CPU ASR and HTTP export
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python -B -X utf8 scripts/ci_smoke.py --download-ci-model --out evaluation/runs/platform-smoke.json
      - name: Install optional Apple Silicon MLX engine
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: python -m pip install -r requirements-mlx.txt
      - name: Actual MLX capability, ASR, fallback and export probe
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python -B -X utf8 scripts/ci_smoke.py --download-ci-model --download-ci-mlx-model --backend auto --out evaluation/runs/mlx-smoke.json
      - name: Upload actual platform result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.os }}
          path: |
            evaluation/runs/
            !evaluation/runs/**/font.*
            !evaluation/runs/**/title-font.*
            !evaluation/runs/**/motion-layer.mov
          if-no-files-found: warn
